# Entorno local de evaluación. Los valores por defecto son SOLO para desarrollo: no usar en producción.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marcas_autos}
      POSTGRES_USER: ${POSTGRES_USER:-marcas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: src/MarcasAutos.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # El host es el nombre del servicio de Compose, no localhost.
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-marcas_autos};Username=${POSTGRES_USER:-marcas_user};Password=${POSTGRES_PASSWORD:-dev_only_change_me};GSS Encryption Mode=Disable
      # Aplica migraciones y seed al iniciar.
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - backend

networks:
  backend:

volumes:
  postgres_data:
